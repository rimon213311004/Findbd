services:
  - type: web
    name: findbd-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: WEB_ORIGIN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL_DAYS
        value: 30
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_REPORT_FOLDER
        value: findbd/reports
      - key: MATCH_DATE_WINDOW_DAYS
        value: 30
      - key: MATCH_DATE_SLACK_DAYS
        value: 1
      - key: MATCH_CANDIDATE_LIMIT
        value: 300
